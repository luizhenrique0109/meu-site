
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mercado-LGPD</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="login-container">
        <h1>Mercado-LGPD</h1>
        <h2>Entrar na sua conta</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem" role="status"></p>

        <nav class="login-links">
            <a href="https://luizhenrique0109.github.io/meu-site/cadastro.html">
                Criar minha conta
            </a>

            <a href="https://luizhenrique0109.github.io/meu-site/cadastro.html">
                Recuperar acesso
            </a>

            <a href="https://luizhenrique0109.github.io/meu-site/privacidade.html">
                Política de Privacidade
            </a>

            <a href="https://luizhenrique0109.github.io/meu-site/termos.html">
                Termos de Uso
            </a>
        </nav>
    </main>

    <script>
        const formulario = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            mensagem.textContent =
                "Demonstração: o login ainda precisa de um servidor para autenticação.";
        });
    </script>

</body>
</html>
